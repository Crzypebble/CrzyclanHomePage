<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Personal Library | Crzyclan Music</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="music.css">
</head>
<body>
  <header>
    <h1>Personal Music Library</h1>
    <p>Your space to store and organize playlists</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="music.html" class="active">Music</a>
    <a href="community.html">Community</a>
    <a href="settings.html">Settings</a>
  </nav>

  <section id="playlist-section">
    <h2>Your Playlists</h2>

    <div id="create-playlist-box">
      <input type="text" id="newPlaylistName" placeholder="Enter playlist name">
      <button id="createPlaylistBtn">Create Playlist</button>
    </div>

    <div class="playlist-grid" id="playlistGrid"></div>
  </section>

  <!-- Playlist Detail Modal -->
  <div id="playlistModal" class="playlist-detail" style="display:none;">
    <button id="backToLibraryBtn" class="playlist-actions">← Back</button>
    <div id="playlistInfo"></div>
    <ul id="playlistSongs" class="song-list"></ul>

    <div class="add-song-section">
      <input type="text" id="songNameInput" placeholder="Song name...">
      <input type="text" id="songArtistInput" placeholder="Artist name...">
      <button id="addSongBtn">Add Song</button>
    </div>
  </div>

  <script src="personal-library.js"></script>
</body>
</html>
