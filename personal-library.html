<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Library | CRZYCLAN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      text-align: center;
      padding: 1.5rem;
      color: #ff2965;
      text-shadow: 0 0 15px #ff2965;
    }

    nav.music-subnav {
      text-align: center;
      margin-bottom: 2rem;
    }

    nav.music-subnav a {
      margin: 0 10px;
      text-decoration: none;
      color: #ff639a;
      font-weight: 600;
      transition: 0.3s;
    }

    nav.music-subnav a:hover,
    nav.music-subnav a.active {
      color: #00ffbf;
      text-shadow: 0 0 10px #00ffbf;
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 2rem;
    }

    .library-section {
      background: rgba(15, 15, 15, 0.9);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(255, 41, 101, 0.25);
      padding: 1.5rem;
      margin-bottom: 2rem;
    }

    .library-section h2 {
      color: #ff2965;
      text-shadow: 0 0 10px #ff2965;
      text-align: center;
    }

    .playlist-list, .track-list {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
      margin-top: 1.5rem;
    }

    .playlist-card, .track-card {
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid #ff2965;
      border-radius: 12px;
      overflow: hidden;
      color: #fff;
      text-align: center;
      width: 200px;
      transition: 0.3s;
      box-shadow: 0 0 12px rgba(255, 41, 101, 0.3);
    }

    .playlist-card:hover,
    .track-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 20px rgba(255, 41, 101, 0.6);
    }

    .playlist-card h3 {
      font-size: 1.1rem;
      margin: 0.8rem 0;
      color: #ff639a;
    }

    .playlist-card button {
      background: transparent;
      border: 1px solid #ff639a;
      color: #ff639a;
      border-radius: 8px;
      padding: 5px 10px;
      margin: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .playlist-card button:hover {
      background: #ff2965;
      color: white;
    }

    .add-playlist {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 1rem;
    }

    .add-playlist input {
      padding: 0.5rem;
      border-radius: 8px;
      border: 1px solid #ff639a;
      background: rgba(30, 30, 30, 0.9);
      color: #fff;
      width: 200px;
    }

    .add-playlist button {
      background: linear-gradient(90deg, #ff2965, #ff639a);
      border: none;
      border-radius: 8px;
      color: #fff;
      padding: 0.6rem 1rem;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 1px;
      box-shadow: 0 0 10px rgba(255, 41, 101, 0.6);
      transition: 0.3s;
    }

    .add-playlist button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 41, 101, 0.9);
    }

    .track-card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      border-bottom: 1px solid #ff2965;
    }

    audio {
      width: 90%;
      margin-top: 5px;
    }

    .track-card button {
      background: transparent;
      border: 1px solid #00ffbf;
      color: #00ffbf;
      border-radius: 8px;
      padding: 4px 10px;
      margin: 5px;
      cursor: pointer;
      transition: 0.3s;
    }

    .track-card button:hover {
      background: #00ffbf;
      color: #000;
    }

    #searchInput {
      display: block;
      margin: 1rem auto;
      width: 60%;
      padding: 0.7rem;
      border-radius: 10px;
      border: 1px solid #00ffbf;
      background: rgba(20, 20, 20, 0.8);
      color: #fff;
      text-align: center;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>CRZYCLAN</h1>
    <p>Personal Music Library</p>
  </header>

  <nav class="music-subnav">
    <a href="music.html">🎧 CRZYCLAN Library</a>
    <a href="community-music.html">🎵 Community Music</a>
    <a href="music-projects.html">🎚️ Music Projects</a>
    <a href="upload.html">⬆️ Upload Track</a>
    <a href="personal-library.html" class="active">🎤 Personal Library</a>
  </nav>

  <main>
    <section class="library-section">
      <h2>Your Playlists</h2>
      <div class="add-playlist">
        <input type="text" id="playlistName" placeholder="New playlist name...">
        <button id="createPlaylist">Create Playlist</button>
      </div>
      <div id="playlistList" class="playlist-list"></div>
    </section>

    <section class="library-section">
      <h2 id="playlistTitle">Select a playlist to view tracks</h2>
      <input type="text" id="searchInput" placeholder="Search songs to add... (from uploads, community, or official)">
      <div id="trackList" class="track-list"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 CRZYCLAN. All rights reserved.
  </footer>

  <script>
    const playlistList = document.getElementById("playlistList");
    const trackList = document.getElementById("trackList");
    const playlistNameInput = document.getElementById("playlistName");
    const createBtn = document.getElementById("createPlaylist");
    const searchInput = document.getElementById("searchInput");
    const playlistTitle = document.getElementById("playlistTitle");

    let selectedPlaylist = null;

    function loadPlaylists() {
      const playlists = JSON.parse(localStorage.getItem("playlists") || "[]");
      playlistList.innerHTML = "";

      playlists.forEach((playlist, index) => {
        const div = document.createElement("div");
        div.className = "playlist-card";
        div.innerHTML = `
          <h3>${playlist.name}</h3>
          <button onclick="viewPlaylist(${index})">Open</button>
          <button onclick="renamePlaylist(${index})">Rename</button>
          <button onclick="deletePlaylist(${index})">Delete</button>
        `;
        playlistList.appendChild(div);
      });
    }

    function savePlaylists(playlists) {
      localStorage.setItem("playlists", JSON.stringify(playlists));
    }

    createBtn.onclick = () => {
      const name = playlistNameInput.value.trim();
      if (!name) return;
      const playlists = JSON.parse(localStorage.getItem("playlists") || "[]");
      playlists.push({ name, tracks: [] });
      savePlaylists(playlists);
      playlistNameInput.value = "";
      loadPlaylists();
    };

    function deletePlaylist(index) {
      const playlists = JSON.parse(localStorage.getItem("playlists"));
      playlists.splice(index, 1);
      savePlaylists(playlists);
      trackList.innerHTML = "";
      playlistTitle.textContent = "Select a playlist to view tracks";
      loadPlaylists();
    }

    function renamePlaylist(index) {
      const playlists = JSON.parse(localStorage.getItem("playlists"));
      const newName = prompt("Enter new playlist name:", playlists[index].name);
      if (newName) {
        playlists[index].name = newName;
        savePlaylists(playlists);
        loadPlaylists();
      }
    }

    function viewPlaylist(index) {
      const playlists = JSON.parse(localStorage.getItem("playlists"));
      selectedPlaylist = index;
      const playlist = playlists[index];
      playlistTitle.textContent = playlist.name;
      renderTracks(playlist.tracks);
    }

    function renderTracks(tracks) {
      trackList.innerHTML = "";
      if (!tracks || tracks.length === 0) {
        trackList.innerHTML = `<p>No tracks yet. Search and add songs below.</p>`;
        return;
      }

      tracks.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "track-card";
        div.innerHTML = `
          <img src="${t.cover}" alt="cover">
          <div><strong>${t.title}</strong><br>${t.artist}</div>
          <audio controls src="${t.audio}"></audio>
          <button onclick="removeFromPlaylist(${i})">Remove</button>
        `;
        trackList.appendChild(div);
      });
    }

    function removeFromPlaylist(trackIndex) {
      const playlists = JSON.parse(localStorage.getItem("playlists"));
      playlists[selectedPlaylist].tracks.splice(trackIndex, 1);
      savePlaylists(playlists);
      renderTracks(playlists[selectedPlaylist].tracks);
    }

    searchInput.addEventListener("input", () => {
      const term = searchInput.value.toLowerCase();
      if (!selectedPlaylist) {
        trackList.innerHTML = `<p>Select a playlist first.</p>`;
        return;
      }

      const uploads = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");
      const community = JSON.parse(localStorage.getItem("communityTracks") || "[]");
      const official = JSON.parse(localStorage.getItem("officialTracks") || "[]");

      const results = [...uploads, ...community, ...official].filter(
        t => t.title.toLowerCase().includes(term) || t.artist.toLowerCase().includes(term)
      );

      trackList.innerHTML = "";
      results.forEach((t, i) => {
        const div = document.createElement("div");
        div.className = "track-card";
        div.innerHTML = `
          <img src="${t.cover}" alt="cover">
          <div><strong>${t.title}</strong><br>${t.artist}</div>
          <audio controls src="${t.audio}"></audio>
          <button onclick='addToPlaylist(${JSON.stringify(t)})'>Add</button>
        `;
        trackList.appendChild(div);
      });
    });

    function addToPlaylist(track) {
      const playlists = JSON.parse(localStorage.getItem("playlists"));
      playlists[selectedPlaylist].tracks.push(track);
      savePlaylists(playlists);
      viewPlaylist(selectedPlaylist);
    }

    loadPlaylists();
  </script>
</body>
</html>
