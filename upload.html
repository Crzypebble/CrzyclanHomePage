<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Track | CRZYCLAN</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #0d0d0d;
      color: #eee;
      font-family: 'Poppins', sans-serif;
      text-align: center;
    }

    #upload-section {
      background: rgba(20, 20, 20, 0.95);
      border-radius: 20px;
      padding: 2rem;
      margin: 2rem auto;
      max-width: 800px;
      box-shadow: 0 0 25px rgba(0, 255, 200, 0.2);
    }

    #upload-section h2 {
      color: #0ff;
      text-shadow: 0 0 10px #00f7ff;
    }

    input, select, button {
      background: #111;
      color: #0ff;
      border: 1px solid #0ff;
      border-radius: 10px;
      padding: 0.6rem;
      margin: 0.4rem;
      font-family: inherit;
    }

    input:focus, select:focus {
      outline: none;
      box-shadow: 0 0 10px #00f7ff;
    }

    button {
      background: #0ff;
      color: #000;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #00cccc;
    }

    #uploaded-tracks {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 1.5rem;
    }

    .track-card {
      background: rgba(10, 10, 10, 0.9);
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 10px;
      width: 220px;
      box-shadow: 0 0 15px rgba(0, 255, 200, 0.2);
      transition: all 0.3s;
      text-align: center;
    }

    .track-card:hover {
      border-color: #0ff;
      transform: scale(1.03);
    }

    .track-cover {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 10px;
    }

    .track-info {
      margin-top: 10px;
    }

    .edit-input {
      width: 90%;
      background: rgba(0,0,0,0.6);
      border: 1px solid #0ff;
      border-radius: 6px;
      color: #0ff;
      text-align: center;
      margin-top: 3px;
    }

    .track-actions button {
      margin: 4px;
      background: #222;
      border: 1px solid #0ff;
      color: #0ff;
      border-radius: 6px;
      cursor: pointer;
    }

    .track-actions button:hover {
      background: #0ff;
      color: #000;
    }

    audio {
      margin-top: 15px;
      width: 100%;
    }
  </style>
</head>
<body>
  <header>
    <h1>Upload Track</h1>
    <p>Share your music with the CRZYCLAN community</p>
  </header>

  <main>
    <section id="upload-section">
      <h2>Upload Your Track</h2>

      <input type="text" id="trackTitle" placeholder="Track Title" required>
      <input type="text" id="trackArtist" placeholder="Artist Name" required>
      <input type="file" id="trackFile" accept="audio/*" required>
      <input type="file" id="coverImage" accept="image/*" required>

      <select id="trackGenre">
        <option value="">Select Genre</option>
        <option value="Rap">Rap</option>
        <option value="Metal">Metal</option>
        <option value="Rock">Rock</option>
        <option value="Electronic">Electronic</option>
        <option value="Game">Game</option>
        <option value="AI">AI Generated</option>
        <option value="custom">Custom...</option>
      </select>
      <input type="text" id="customGenreInput" placeholder="Enter custom genre" style="display:none;">

      <button onclick="uploadTrack()">Upload</button>

      <h2 style="margin-top:2rem;">Your Uploaded Tracks</h2>
      <div id="uploaded-tracks"></div>
    </section>
  </main>

  <audio id="audio-player" controls style="display:none;"></audio>

  <script>
    const genreSelect = document.getElementById('trackGenre');
    const customGenreInput = document.getElementById('customGenreInput');
    const uploadedTracksContainer = document.getElementById('uploaded-tracks');
    const audioPlayer = document.getElementById('audio-player');

    genreSelect.addEventListener('change', () => {
      customGenreInput.style.display = genreSelect.value === 'custom' ? 'inline-block' : 'none';
    });

    let tracks = JSON.parse(localStorage.getItem('uploadedTracks')) || [];

    function uploadTrack() {
      const title = document.getElementById('trackTitle').value.trim();
      const artist = document.getElementById('trackArtist').value.trim();
      const genre = genreSelect.value === 'custom'
        ? customGenreInput.value.trim()
        : genreSelect.value;
      const file = document.getElementById('trackFile').files[0];
      const cover = document.getElementById('coverImage').files[0];

      if (!title || !artist || !file || !cover) {
        alert("Please fill out all fields.");
        return;
      }

      const reader = new FileReader();
      const coverReader = new FileReader();

      reader.onload = function(e) {
        coverReader.onload = function(c) {
          const track = {
            id: Date.now(),
            title,
            artist,
            genre,
            file: e.target.result,
            cover: c.target.result
          };
          tracks.push(track);
          saveTracks();
          renderTracks();
        };
        coverReader.readAsDataURL(cover);
      };
      reader.readAsDataURL(file);
    }

    function renderTracks() {
      uploadedTracksContainer.innerHTML = '';
      if (tracks.length === 0) {
        uploadedTracksContainer.innerHTML = '<p>No uploads yet. Once you upload, your tracks will appear here.</p>';
        return;
      }

      tracks.forEach(track => {
        const card = document.createElement('div');
        card.className = 'track-card';
        card.innerHTML = `
          <img src="${track.cover}" class="track-cover">
          <div class="track-info">
            <input class="edit-input" value="${track.title}" onchange="updateTrack(${track.id}, 'title', this.value)">
            <input class="edit-input" value="${track.artist}" onchange="updateTrack(${track.id}, 'artist', this.value)">
            <input class="edit-input" value="${track.genre}" onchange="updateTrack(${track.id}, 'genre', this.value)">
          </div>
          <div class="track-actions">
            <button onclick="playTrack('${track.file}', '${track.title}')">▶ Play</button>
            <button onclick="deleteTrack(${track.id})">🗑 Delete</button>
          </div>
        `;
        uploadedTracksContainer.appendChild(card);
      });
    }

    function playTrack(file, title) {
      audioPlayer.src = file;
      audioPlayer.style.display = 'block';
      audioPlayer.play();
    }

    function updateTrack(id, field, value) {
      const track = tracks.find(t => t.id === id);
      if (track) {
        track[field] = value;
        saveTracks();
      }
    }

    function deleteTrack(id) {
      tracks = tracks.filter(t => t.id !== id);
      saveTracks();
      renderTracks();
    }

    function saveTracks() {
      localStorage.setItem('uploadedTracks', JSON.stringify(tracks));
    }

    renderTracks();
  </script>
</body>
</html>
