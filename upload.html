<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Track | CRZYCLAN</title>
  <link rel="stylesheet" href="style.css">

  <style>
    body {
      background-color: #000;
      color: white;
      font-family: 'Poppins', sans-serif;
    }

    /* Upload Section */
    #upload-section {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 16px;
      padding: 2rem;
      margin: 2rem auto;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(255, 0, 80, 0.25);
      color: #fff;
    }

    #upload-section h2 {
      font-size: 1.8rem;
      text-align: center;
      color: #ff2965;
      text-shadow: 0 0 10px #ff2965;
      margin-bottom: 1.5rem;
    }

    .upload-box form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .upload-box input,
    .upload-box select,
    .upload-box textarea {
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid #ff2965;
      border-radius: 8px;
      color: #fff;
      padding: 0.7rem;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .upload-box input:focus,
    .upload-box select:focus,
    .upload-box textarea:focus {
      outline: none;
      box-shadow: 0 0 10px #ff2965;
    }

    .upload-box button {
      background: linear-gradient(90deg, #ff2965, #ff639a);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.8rem;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255, 41, 101, 0.6);
      transition: 0.3s;
    }

    .upload-box button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 41, 101, 0.9);
    }

    #uploaded-tracks {
      background: rgba(10, 10, 10, 0.7);
      border-radius: 16px;
      margin: 3rem auto;
      padding: 1rem 2rem;
      max-width: 1100px;
      box-shadow: 0 0 20px rgba(0, 255, 191, 0.25);
    }

    #uploaded-tracks h3 {
      color: #00ffbf;
      text-align: center;
      text-shadow: 0 0 8px #00ffbf;
      margin-bottom: 1.5rem;
    }

    /* Track List Grid */
    #uploadedList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 1.5rem;
      justify-items: center;
    }

    .track-card {
      background: rgba(20, 20, 20, 0.85);
      border: 1px solid #ff2965;
      border-radius: 12px;
      overflow: hidden;
      color: #fff;
      text-align: center;
      transition: 0.3s;
      box-shadow: 0 0 10px rgba(255, 41, 101, 0.3);
    }

    .track-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 0 15px rgba(255, 41, 101, 0.7);
    }

    .track-card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid #ff2965;
    }

    .track-info {
      padding: 0.8rem;
    }

    .track-info h4 {
      margin: 0.4rem 0;
      color: #ff639a;
      font-size: 1.1rem;
    }

    .track-info p {
      margin: 0;
      color: #ccc;
      font-size: 0.9rem;
    }

    audio {
      width: 90%;
      margin: 0.5rem auto;
      display: block;
    }

    .track-actions {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .track-actions button {
      background: transparent;
      border: 1px solid #ff639a;
      color: #ff639a;
      border-radius: 8px;
      padding: 5px 10px;
      cursor: pointer;
      transition: 0.3s;
    }

    .track-actions button:hover {
      background: #ff2965;
      color: white;
    }

    #upload-status {
      text-align: center;
      color: #00ffbf;
      margin-top: 1rem;
    }

    #customGenre {
      display: none;
    }
  </style>
</head>

<body>
  <header>
    <h1>CRZYCLAN</h1>
    <p>Home of Chaos, Music, and Mayhem</p>
  </header>

  <nav class="music-subnav">
    <a href="music.html">🎧 CRZYCLAN Library</a>
    <a href="community-music.html">🎵 Community Music</a>
    <a href="music-projects.html">🎚️ Music Projects</a>
    <a href="upload.html" class="active">⬆️ Upload Track</a>
    <a href="personal-library.html">🎤 Personal Library</a>
  </nav>

  <main>
    <section id="upload-section">
      <h2>Upload Your Music</h2>
      <div class="upload-box">
        <form id="upload-form">
          <input type="text" id="trackTitle" placeholder="Track Title" required>
          <input type="text" id="artistName" placeholder="Artist Name" required>

          <select id="genre">
            <option value="">-- Select a Genre --</option>
            <option value="Rap">Rap</option>
            <option value="Metal">Metal</option>
            <option value="Alt / Rock">Alt / Rock</option>
            <option value="Game Music">Game Music</option>
            <option value="AI Generated">AI Generated</option>
            <option value="custom">Custom Genre</option>
          </select>

          <input type="text" id="customGenre" placeholder="Enter custom genre">

          <input type="file" id="coverArt" accept="image/*">
          <input type="file" id="trackFile" accept=".mp3, .wav" required>

          <textarea id="description" rows="3" placeholder="Track Description (optional)"></textarea>

          <button type="submit">Upload Track</button>
        </form>
        <div id="upload-status"></div>
      </div>
    </section>

    <section id="uploaded-tracks">
      <h3>Your Uploaded Tracks</h3>
      <div id="uploadedList"></div>
    </section>
  </main>

  <footer>&copy; 2025 CRZYCLAN. All rights reserved.</footer>

  <script>
    const form = document.getElementById("upload-form");
    const uploadStatus = document.getElementById("upload-status");
    const uploadedList = document.getElementById("uploadedList");
    const genreSelect = document.getElementById("genre");
    const customGenre = document.getElementById("customGenre");

    genreSelect.addEventListener("change", () => {
      customGenre.style.display = genreSelect.value === "custom" ? "block" : "none";
    });

    function loadTracks() {
      let saved = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");
      uploadedList.innerHTML = "";

      if (saved.length === 0) {
        uploadedList.innerHTML = `<p>No uploads yet. Once you upload, your tracks will appear here.</p>`;
        return;
      }

      saved.sort((a, b) => new Date(b.date) - new Date(a.date));

      saved.forEach((track, index) => {
        const card = document.createElement("div");
        card.className = "track-card";
        card.innerHTML = `
          <img src="${track.cover}" alt="Cover Art">
          <div class="track-info">
            <h4>${track.title}</h4>
            <p>${track.artist}</p>
          </div>
          <audio controls src="${track.audio}"></audio>
          <div class="track-actions">
            <button onclick="editTrack(${index})">Edit</button>
            <button onclick="deleteTrack(${index})">Delete</button>
          </div>
        `;
        uploadedList.appendChild(card);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("trackTitle").value.trim();
      const artist = document.getElementById("artistName").value.trim();
      const genre = genreSelect.value === "custom" ? customGenre.value.trim() : genreSelect.value;
      const audioFile = document.getElementById("trackFile").files[0];
      const coverFile = document.getElementById("coverArt").files[0];

      if (!title || !artist || !audioFile) {
        uploadStatus.textContent = "⚠️ Please fill out all required fields.";
        return;
      }

      const audioReader = new FileReader();
      audioReader.onload = (e) => {
        const audioData = e.target.result;
        if (coverFile) {
          const coverReader = new FileReader();
          coverReader.onload = (ev) => {
            saveTrack(title, artist, genre, audioData, ev.target.result);
          };
          coverReader.readAsDataURL(coverFile);
        } else {
          const defaultCover = "https://github.com/Crzypebble/CrzyclanHomePage/blob/main/default-cover.jpg?raw=true";
          saveTrack(title, artist, genre, audioData, defaultCover);
        }
      };
      audioReader.readAsDataURL(audioFile);
    });

    function saveTrack(title, artist, genre, audio, cover) {
      let tracks = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");
      tracks.push({ title, artist, genre, audio, cover, date: new Date().toISOString() });
      localStorage.setItem("uploadedTracks", JSON.stringify(tracks));
      uploadStatus.textContent = "✅ Track uploaded successfully!";
      form.reset();
      customGenre.style.display = "none";
      loadTracks();
    }

    function deleteTrack(index) {
      let tracks = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");
      tracks.splice(index, 1);
      localStorage.setItem("uploadedTracks", JSON.stringify(tracks));
      loadTracks();
    }

    function editTrack(index) {
      let tracks = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");
      let t = tracks[index];
      const newTitle = prompt("Edit Title:", t.title);
      const newArtist = prompt("Edit Artist:", t.artist);
      const newGenre = prompt("Edit Genre:", t.genre);
      if (newTitle) t.title = newTitle;
      if (newArtist) t.artist = newArtist;
      if (newGenre) t.genre = newGenre;
      localStorage.setItem("uploadedTracks", JSON.stringify(tracks));
      loadTracks();
    }

    loadTracks();
  </script>
</body>
</html>
