<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Personal Library | CRZYCLAN</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="personal-library.css">
</head>

<body>
  <header>
    <h1>CRZYCLAN</h1>
    <p>Personal Music Library</p>
  </header>

  <nav class="music-subnav">
    <a href="music.html">🎧 CRZYCLAN Library</a>
    <a href="community-music.html">🎵 Community Music</a>
    <a href="music-projects.html">🎚️ Music Projects</a>
    <a href="upload.html">⬆️ Upload Track</a>
    <a href="personal-library.html" class="active">🎤 Personal Library</a>
  </nav>

  <main>
    <div id="searchContainer">
      <input type="text" id="searchInput" placeholder="Search or add songs to playlists...">
    </div>

    <section class="library-section" id="playlistSection">
      <h2>Your Playlists</h2>
      <div class="add-playlist">
        <input type="text" id="playlistName" placeholder="New playlist name...">
        <button id="createPlaylist">Create</button>
      </div>
      <div id="playlistList" class="playlist-list"></div>
    </section>

    <section class="library-section" id="tracksSection" style="display:none;">
      <button id="backButton">⬅ Back to Playlists</button>
      <h2 id="playlistTitle"></h2>
      <input type="file" id="playlistCover" accept="image/*" style="display:block;margin:1rem auto;">
      <div id="trackList" class="track-list"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 CRZYCLAN. All rights reserved.
  </footer>

  <script src="personal-library.js"></script>
</body>
</html>
