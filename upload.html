<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Upload Track | CRZYCLAN</title>
  <link rel="stylesheet" href="style.css">

  <style>
    /* --- Upload Section Enhancements --- */
    #upload-section {
      background: rgba(0, 0, 0, 0.7);
      border-radius: 16px;
      padding: 2rem;
      margin: 2rem auto;
      max-width: 800px;
      box-shadow: 0 0 20px rgba(255, 0, 80, 0.25);
      color: #fff;
    }

    #upload-section h2 {
      font-size: 1.8rem;
      text-align: center;
      color: #ff2965;
      text-shadow: 0 0 10px #ff2965;
      margin-bottom: 1.5rem;
    }

    #upload-section p {
      text-align: center;
      margin-bottom: 2rem;
      color: #ccc;
    }

    .upload-box form {
      display: flex;
      flex-direction: column;
      gap: 1.2rem;
    }

    .upload-box label {
      font-weight: bold;
      color: #ff639a;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .upload-box input[type="text"],
    .upload-box input[type="file"],
    .upload-box select,
    .upload-box textarea {
      background: rgba(30, 30, 30, 0.9);
      border: 1px solid #ff2965;
      border-radius: 8px;
      color: #fff;
      padding: 0.7rem;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .upload-box input:focus,
    .upload-box select:focus,
    .upload-box textarea:focus {
      outline: none;
      box-shadow: 0 0 10px #ff2965;
      border-color: #ff639a;
    }

    .upload-box button {
      background: linear-gradient(90deg, #ff2965, #ff639a);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.8rem 1.2rem;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
      text-transform: uppercase;
      transition: 0.3s;
      letter-spacing: 1px;
      box-shadow: 0 0 12px rgba(255, 41, 101, 0.6);
    }

    .upload-box button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 20px rgba(255, 41, 101, 0.9);
    }

    #upload-status {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 1rem;
      color: #00ffbf;
    }

    #uploaded-tracks {
      max-width: 900px;
      margin: 3rem auto;
      padding: 1rem 2rem;
      background: rgba(10, 10, 10, 0.7);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 255, 191, 0.25);
    }

    #uploaded-tracks h3 {
      color: #00ffbf;
      text-align: center;
      text-shadow: 0 0 8px #00ffbf;
      margin-bottom: 1.5rem;
    }

    #uploadedList {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1.2rem;
    }

    .track-card {
      width: 200px;
      background: rgba(25, 25, 25, 0.9);
      border: 1px solid #ff2965;
      border-radius: 12px;
      overflow: hidden;
      color: #fff;
      text-align: center;
      transition: 0.3s;
      padding-bottom: 1rem;
    }

    .track-card img.track-art {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-bottom: 1px solid #ff2965;
    }

    .track-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 0 15px rgba(255, 41, 101, 0.7);
    }

    .track-card button {
      background: transparent;
      border: 1px solid #ff639a;
      color: #ff639a;
      padding: 5px 10px;
      margin: 5px;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }

    .track-card button:hover {
      background: #ff2965;
      color: white;
    }

    audio {
      width: 90%;
      margin-top: 5px;
    }

    #customGenre {
      display: none;
    }

    @media (max-width: 700px) {
      #upload-section {
        padding: 1.5rem;
      }
      .track-card {
        width: 160px;
      }
    }
  </style>
</head>

<body>
  <header>
    <h1>CRZYCLAN</h1>
    <p>Home of Chaos, Music, and Mayhem</p>
  </header>

  <nav class="music-subnav">
    <a href="music.html">🎧 CRZYCLAN Library</a>
    <a href="community-music.html">🎵 Community Music</a>
    <a href="music-projects.html">🎚️ Music Projects</a>
    <a href="upload.html" class="active">⬆️ Upload Track</a>
    <a href="personal-library.html">🎤 Personal Library</a>
  </nav>

  <main>
    <section id="upload-section">
      <h2>Upload Your Music</h2>
      <p>Upload your personal tracks — they’ll appear only in your Personal Library.</p>

      <div class="upload-box">
        <form id="upload-form">
          <label for="trackTitle">Track Title:</label>
          <input type="text" id="trackTitle" required>

          <label for="artistName">Artist Name:</label>
          <input type="text" id="artistName" required>

          <label for="genre">Genre:</label>
          <select id="genre">
            <option value="">-- Select a Genre --</option>
            <option value="Rap">Rap</option>
            <option value="Metal">Metal</option>
            <option value="Alt / Rock">Alt / Rock</option>
            <option value="Game Music">Game Music</option>
            <option value="AI Generated">AI Generated</option>
            <option value="custom">Custom Genre</option>
          </select>

          <input type="text" id="customGenre" placeholder="Enter your custom genre...">

          <label for="coverArt">Album / Cover Art:</label>
          <input type="file" id="coverArt" accept="image/*">

          <label for="trackFile">Track File (MP3/WAV):</label>
          <input type="file" id="trackFile" accept=".mp3, .wav" required>

          <label for="description">Description (optional):</label>
          <textarea id="description" rows="3" placeholder="Describe your track..."></textarea>

          <button type="submit">Upload Track</button>
        </form>

        <div id="upload-status"></div>
      </div>
    </section>

    <section id="uploaded-tracks">
      <h3>Your Uploaded Tracks</h3>
      <div id="uploadedList"></div>
    </section>
  </main>

  <footer>
    &copy; 2025 CRZYCLAN. All rights reserved.
  </footer>

  <script>
    const form = document.getElementById("upload-form");
    const uploadStatus = document.getElementById("upload-status");
    const uploadedList = document.getElementById("uploadedList");
    const genreSelect = document.getElementById("genre");
    const customGenre = document.getElementById("customGenre");

    genreSelect.addEventListener("change", () => {
      customGenre.style.display = genreSelect.value === "custom" ? "block" : "none";
    });

    function loadTracks() {
      const saved = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");
      uploadedList.innerHTML = "";
      if (saved.length === 0) {
        uploadedList.innerHTML = "<p>No uploads yet. Once you upload, your tracks will appear here.</p>";
        return;
      }

      saved.forEach((track, index) => {
        const card = document.createElement("div");
        card.className = "track-card";
        card.innerHTML = `
          <img src="${track.cover}" alt="Cover" class="track-art">
          <div><strong>${track.title}</strong><br>${track.artist}<br><em>${track.genre}</em></div>
          <audio controls src="${track.audio}"></audio>
          <div>
            <button onclick="editTrack(${index})">Edit</button>
            <button onclick="deleteTrack(${index})">Delete</button>
          </div>
        `;
        uploadedList.appendChild(card);
      });
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const title = document.getElementById("trackTitle").value;
      const artist = document.getElementById("artistName").value;
      const genre = genreSelect.value === "custom" ? customGenre.value : genreSelect.value;
      const audioFile = document.getElementById("trackFile").files[0];
      const coverFile = document.getElementById("coverArt").files[0];

      if (!audioFile) return alert("Please upload an audio file.");

      const readerAudio = new FileReader();
      const readerCover = new FileReader();

      readerAudio.onload = () => {
        const audioURL = readerAudio.result;

        if (coverFile) {
          readerCover.onload = () => saveTrack(audioURL, readerCover.result);
          readerCover.readAsDataURL(coverFile);
        } else {
          saveTrack(audioURL, "https://github.com/Crzypebble/CrzyclanHomePage/blob/main/default-cover.jpg?raw=true");
        }
      };

      readerAudio.readAsDataURL(audioFile);
    });

    function saveTrack(audio, cover) {
      const title = document.getElementById("trackTitle").value;
      const artist = document.getElementById("artistName").value;
      const genre = genreSelect.value === "custom" ? customGenre.value : genreSelect.value;
      const tracks = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");

      tracks.push({ title, artist, genre, audio, cover });
      localStorage.setItem("uploadedTracks", JSON.stringify(tracks));

      uploadStatus.textContent = "✅ Track uploaded successfully!";
      form.reset();
      customGenre.style.display = "none";
      loadTracks();
    }

    function deleteTrack(index) {
      const tracks = JSON.parse(localStorage.getItem("uploadedTracks") || "[]");
      tracks.splice(index, 1);
      localStorage.setItem("uploadedTracks", JSON.stringify(tracks));
      loadTracks();
    }

    function editTrack(index) {
      const tracks = JSON.parse(localStorage.getItem("uploadedTracks"));
      const track = tracks[index];
      const newTitle = prompt("Edit Title:", track.title);
      const newArtist = prompt("Edit Artist:", track.artist);
      const newGenre = prompt("Edit Genre:", track.genre);

      if (newTitle) track.title = newTitle;
      if (newArtist) track.artist = newArtist;
      if (newGenre) track.genre = newGenre;

      localStorage.setItem("uploadedTracks", JSON.stringify(tracks));
      loadTracks();
    }

    loadTracks();
  </script>
</body>
</html>
